name: Create release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish standalone Windows app
        run: dotnet publish NovaGit.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true --output release/NovaGit

      - name: Create ZIP package
        shell: pwsh
        run: Compress-Archive -Path release/NovaGit/* -DestinationPath release/NovaGit-win-x64.zip

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: NovaGit-win-x64
          path: release/NovaGit-win-x64.zip
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release/NovaGit-win-x64.zip --title "NovaGit ${{ github.ref_name }}" --generate-notes
